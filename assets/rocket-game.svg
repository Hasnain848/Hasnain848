<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Space background -->
  <rect width="800" height="400" fill="#0a0a2a"/>
  
  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="50" cy="50" r="1"/>
    <circle cx="120" cy="80" r="1.5"/>
    <circle cx="200" cy="30" r="1"/>
    <circle cx="280" cy="120" r="1.2"/>
    <circle cx="350" cy="50" r="1"/>
    <circle cx="400" cy="200" r="1.5"/>
    <circle cx="450" cy="120" r="1"/>
    <circle cx="500" cy="80" r="1.2"/>
    <circle cx="550" cy="180" r="1"/>
    <circle cx="600" cy="150" r="1.3"/>
    <circle cx="650" cy="220" r="1"/>
    <circle cx="700" cy="90" r="1.5"/>
    <circle cx="750" cy="180" r="1"/>
    <circle cx="100" cy="250" r="1.4"/>
    <circle cx="150" cy="300" r="1"/>
    <circle cx="250" cy="220" r="1.5"/>
    <circle cx="300" cy="280" r="1"/>
    <circle cx="430" cy="320" r="1.4"/>
    <circle cx="500" cy="270" r="1"/>
    <circle cx="580" cy="330" r="1.2"/>
    <circle cx="650" cy="300" r="1"/>
    <circle cx="720" cy="350" r="1.5"/>
  </g>
  
  <!-- Larger stars with glow -->
  <g>
    <circle cx="180" cy="150" r="2" fill="#ffffff"/>
    <circle cx="180" cy="150" r="4" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.5"/>
    
    <circle cx="480" cy="70" r="2" fill="#ffffff"/>
    <circle cx="480" cy="70" r="4" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.5"/>
    
    <circle cx="620" cy="250" r="2" fill="#ffffff"/>
    <circle cx="620" cy="250" r="4" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.5"/>
    
    <circle cx="330" cy="350" r="2" fill="#ffffff"/>
    <circle cx="330" cy="350" r="4" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.5"/>
  </g>
  
  <!-- Asteroid belt -->
  <g fill="#8a8a8a" opacity="0.7">
    <circle cx="150" cy="200" r="8"/>
    <circle cx="200" cy="220" r="6"/>
    <circle cx="220" cy="180" r="5"/>
    <circle cx="260" cy="200" r="7"/>
    <circle cx="280" cy="230" r="4"/>
    <circle cx="320" cy="190" r="6"/>
    <circle cx="350" cy="220" r="5"/>
    <circle cx="380" cy="200" r="4"/>
    <circle cx="420" cy="180" r="7"/>
    <circle cx="450" cy="220" r="5"/>
    <circle cx="480" cy="190" r="6"/>
    <circle cx="510" cy="210" r="4"/>
    <circle cx="540" cy="190" r="7"/>
    <circle cx="580" cy="220" r="5"/>
    <circle cx="610" cy="190" r="8"/>
  </g>
  
  <!-- Rocket -->
  <g transform="translate(400, 200) rotate(-30)">
    <!-- Rocket body -->
    <ellipse cx="0" cy="0" rx="30" ry="70" fill="#ff4757"/>
    
    <!-- Rocket wings -->
    <path d="M -15,20 L -50,60 L -15,40 Z" fill="#ff6b81"/>
    <path d="M 15,20 L 50,60 L 15,40 Z" fill="#ff6b81"/>
    
    <!-- Rocket window -->
    <circle cx="0" cy="-20" r="10" fill="#70a1ff"/>
    <circle cx="0" cy="-20" r="8" fill="#1e90ff"/>
    
    <!-- Rocket engines -->
    <circle cx="-10" cy="50" r="8" fill="#f1f2f6"/>
    <circle cx="10" cy="50" r="8" fill="#f1f2f6"/>
    
    <!-- Engine flames -->
    <g>
      <path d="M -10,60 L -15,80 L -10,75 L -5,90 L 0,75 L 5,90 L 10,75 L 15,80 L 10,60 Z" fill="#ffa502"/>
      <path d="M -8,60 L -12,75 L -8,70 L -4,80 L 0,70 L 4,80 L 8,70 L 12,75 L 8,60 Z" fill="#ff6348"/>
    </g>
  </g>
  
  <!-- Game title -->
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#ff6b81" text-anchor="middle">ROCKET ADVENTURE</text>
  
  <!-- Game UI elements -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="120" height="40" rx="5" fill="#2f3542" opacity="0.7"/>
    <text x="10" y="25" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">SCORE: 12580</text>
  </g>
  
  <g transform="translate(630, 50)">
    <rect x="0" y="0" width="120" height="40" rx="5" fill="#2f3542" opacity="0.7"/>
    <text x="10" y="25" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">LIVES: ★★★</text>
  </g>
</svg>
